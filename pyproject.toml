[project]
name = "webapp-starter"
version = "0.1.7"
description = "Template for Python package published on PyPI"
authors = [{name = "Quinten Roets", email = "qdr2104@columbia.edu"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "package-utils[context] >=0.8.3, <1",
    "powercli >=0.4.0, <1",
    "uvicorn >=0.23.2, <1",
]

[project.optional-dependencies]
dev = [
    "python-dotenv >=1.0.1, <2",  # optional dependency of uvicorn -> needed for mypy
    "package-dev-tools >=0.8.1, <1",
    "package-dev-utils >=0.1.6, <1",
    "types-requests >=2.31.0.10, <3",
]

[project.urls]
"Source Code" = "https://github.com/quintenroets/webapp-starter"

[project.scripts]
start-backend = "webapp_starter.cli.backend:entry_point"
start-webapp = "webapp_starter.cli.webapp:entry_point"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
command_line = "-m pytest tests"

[tool.coverage.report]
precision = 4
fail_under = 100

[tool.mypy]
strict = true
no_implicit_reexport = false

[tool.pytest.ini_options]
pythonpath = [
    "src", ".",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",   # annotated with Any
    "D1",       # missing docstrings
    "D200",     # one-line docstring
    "D203",     # conflicts with D211
    "D205",     # blank line between summary and description
    "D212",     # conflicts with D213
    "D401",     # imperative first line
    "G004",     # logging f-string
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401"  # unused import
]
"tests/*" = [
    "S101"  # assert used
]

[tool.setuptools.package-data]
webapp_starter = ["py.typed"]
